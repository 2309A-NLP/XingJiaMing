supported_extensions:
  - ".pdf"
  - ".docx"
  - ".md"
  - ".txt"

pdf:
  scan_page_char_threshold: 8
  scan_ratio_threshold: 0.7
  text_ratio_threshold: 0.3
  pending_confirmation_margin: 0.1

length_distribution:
  low_text_threshold: 20
  buckets:
    - name: "0-100"
      min: 0
      max: 100
    - name: "101-500"
      min: 101
      max: 500
    - name: "501-1000"
      min: 501
      max: 1000
    - name: "1001+"
      min: 1001
      max:

sensitive_info:
  phone:
    enabled: true
    pattern: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
  email:
    enabled: true
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
  id_card:
    enabled: true
    pattern: "(?<!\\d)\\d{17}[\\dXx](?!\\d)"
  bank_card:
    enabled: false
    pattern: "(?<!\\d)\\d{16,19}(?!\\d)"
  context_window: 12

html:
  title: "文档质量评估报告"

ocr:
  execution_enabled: false
  fail_on_error: false

simhash:
  enabled: false
  distance_threshold: 12
