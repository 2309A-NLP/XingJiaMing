<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0a2e 0%,#1a1a4e 30%,#0d2137 70%,#0a0a2e 100%);color:#e0e0e0;font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.particle{position:absolute;border-radius:50%;animation:float 8s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-30px) scale(1.1);opacity:.6}}
.header{text-align:center;padding:40px 20px 20px;position:relative;z-index:1}
.header h1{font-size:2.5em;background:linear-gradient(90deg,#00d4ff,#7b68ee,#ff6ec7,#00d4ff);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}

.controls{display:flex;justify-content:center;gap:12px;margin:15px 0;position:relative;z-index:1;flex-wrap:wrap}
.controls button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccd6f6;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:.9em;transition:.3s}
.controls button:hover{background:rgba(100,100,255,.25);border-color:rgba(100,100,255,.5)}
.controls button.active{background:rgba(0,212,255,.2);border-color:#00d4ff;color:#00d4ff}
.mindmap{max-width:1400px;margin:0 auto;padding:20px;position:relative;z-index:1}
.node{margin:6px 0;transition:all .4s cubic-bezier(.4,0,.2,1)}
.node-header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;cursor:pointer;transition:all .3s;position:relative;user-select:none}
.node-header:hover{transform:translateX(6px);filter:brightness(1.2)}
.node-header::before{content:'';position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;opacity:0;transition:opacity .3s}
.node-header:hover::before{opacity:.08;background:#fff}
.node-icon{font-size:1.3em;width:28px;text-align:center;flex-shrink:0}
.node-title{font-weight:600;font-size:1.05em;flex-grow:1}
.node-badge{font-size:.7em;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.1);color:#8892b0;flex-shrink:0}
.node-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7em;transition:transform .3s;color:#8892b0}
.node-toggle.open{transform:rotate(90deg)}
.node-children{margin-left:28px;border-left:2px solid rgba(255,255,255,.06);padding-left:16px;overflow:hidden;transition:max-height .5s ease,opacity .4s ease}
.node-children.collapsed{max-height:0!important;opacity:0;pointer-events:none}
.node-children.expanded{opacity:1}
/* Color themes */
.theme-root>.node-header{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,104,238,.15));border:1px solid rgba(0,212,255,.25);font-size:1.2em}
.theme-blue>.node-header{background:linear-gradient(135deg,rgba(0,150,255,.1),rgba(0,100,200,.08));border:1px solid rgba(0,150,255,.2)}
.theme-purple>.node-header{background:linear-gradient(135deg,rgba(150,100,255,.1),rgba(100,50,200,.08));border:1px solid rgba(150,100,255,.2)}
.theme-green>.node-header{background:linear-gradient(135deg,rgba(0,200,150,.1),rgba(0,150,100,.08));border:1px solid rgba(0,200,150,.2)}
.theme-orange>.node-header{background:linear-gradient(135deg,rgba(255,165,0,.1),rgba(200,120,0,.08));border:1px solid rgba(255,165,0,.2)}
.theme-pink>.node-header{background:linear-gradient(135deg,rgba(255,110,199,.1),rgba(200,80,150,.08));border:1px solid rgba(255,110,199,.2)}
.theme-cyan>.node-header{background:linear-gradient(135deg,rgba(0,200,255,.1),rgba(0,150,200,.08));border:1px solid rgba(0,200,255,.2)}
.theme-red>.node-header{background:linear-gradient(135deg,rgba(255,80,80,.1),rgba(200,50,50,.08));border:1px solid rgba(255,80,80,.2)}
.theme-yellow>.node-header{background:linear-gradient(135deg,rgba(255,220,50,.1),rgba(200,170,30,.08));border:1px solid rgba(255,220,50,.2)}
.leaf{font-size:.9em;color:#8892b0;padding:6px 18px;display:flex;align-items:center;gap:8px;transition:all .3s}
.leaf:hover{color:#ccd6f6;transform:translateX(4px)}
.leaf::before{content:'›';color:#4a4a8a;font-weight:bold}
.code-tag{background:rgba(0,212,255,.12);color:#7ec8e3;padding:2px 8px;border-radius:4px;font-size:.85em;font-family:'Cascadia Code','Fira Code',monospace}
.footer{text-align:center;padding:40px 20px;color:#4a4a6a;font-size:.85em;position:relative;z-index:1}
.search-box{display:flex;justify-content:center;margin:10px 0;position:relative;z-index:1}
.search-box input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ccd6f6;padding:10px 20px;border-radius:25px;width:320px;font-size:.95em;outline:none;transition:.3s}
.search-box input:focus{border-color:rgba(0,212,255,.4);box-shadow:0 0 20px rgba(0,212,255,.1)}
.search-box input::placeholder{color:#5a5a7a}
.highlight{background:rgba(255,220,50,.25);border-radius:3px;padding:0 2px}
.node.hidden{display:none}
</style>

function renderNode(node, depth=0) {
  const hasChildren = node.children && node.children.length > 0;
  const isLeaf = !hasChildren;
  let html = `<div class="node ${isLeaf?'':'parent'}" data-depth="${depth}">`;
  html += `<div class="node-header theme-${node.theme||'blue'}" onclick="${hasChildren?'toggleNode(this)':''}">`;
  if(hasChildren) html += `<span class="node-toggle open">▶</span>`;
  html += `<span class="node-icon">${node.icon||'📌'}</span>`;
  html += `<span class="node-title">${node.title}</span>`;
  if(node.badge) html += `<span class="node-badge">${node.badge}</span>`;
  html += `</div>`;
  if(hasChildren) {
    html += `<div class="node-children expanded">`;
    node.children.forEach(c => html += renderNode(c, depth+1));
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

document.getElementById('mindmap').innerHTML = renderNode(data);

function toggleNode(el) {
  const children = el.nextElementSibling;
  const toggle = el.querySelector('.node-toggle');
  if(!children) return;
  if(children.classList.contains('expanded')) {
    children.classList.remove('expanded');
    children.classList.add('collapsed');
    toggle.classList.remove('open');
  } else {
    children.classList.remove('collapsed');
    children.classList.add('expanded');
    toggle.classList.add('open');
  }
}

function expandAll() {
  document.querySelectorAll('.node-children').forEach(el => {
    el.classList.remove('collapsed'); el.classList.add('expanded');
  });
  document.querySelectorAll('.node-toggle').forEach(el => el.classList.add('open'));
}
function collapseAll() {
  document.querySelectorAll('.node-children').forEach(el => {
    el.classList.remove('expanded'); el.classList.add('collapsed');
  });
  document.querySelectorAll('.node-toggle').forEach(el => el.classList.remove('open'));
}
function expandToLevel(level) {
  document.querySelectorAll('.node').forEach(el => {
    const d = parseInt(el.dataset.depth);
    const children = el.querySelector(':scope > .node-children');
    const toggle = el.querySelector(':scope > .node-header > .node-toggle');
    if(children) {
      if(d < level) {
        children.classList.remove('collapsed'); children.classList.add('expanded');
        if(toggle) toggle.classList.add('open');
      } else {
        children.classList.remove('expanded'); children.classList.add('collapsed');
        if(toggle) toggle.classList.remove('open');
      }
    }
  });
}

function searchNodes(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.node').forEach(el => {
    const title = el.querySelector(':scope > .node-header .node-title');
    if(!title) return;
    const text = title.textContent.toLowerCase();
    if(!q) { el.classList.remove('hidden'); return; }
    if(text.includes(q)) {
      el.classList.remove('hidden');
      let parent = el.parentElement.closest('.node');
      while(parent) {
        parent.classList.remove('hidden');
        const ch = parent.querySelector(':scope > .node-children');
        const tg = parent.querySelector(':scope > .node-header .node-toggle');
        if(ch){ch.classList.remove('collapsed');ch.classList.add('expanded');}
        if(tg)tg.classList.add('open');
        parent = parent.parentElement.closest('.node');
      }
    } else {
      if(!el.querySelector('.node')) el.classList.add('hidden');
    }
  });
}

(function(){

    c.appendChild(p);
  }
})();
